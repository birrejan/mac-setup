prSections:
    - title: My Pull Requests
      filters: is:open author:@me org:InSpace-GEO
    - title: CI failing
      filters: is:open author:@me org:InSpace-GEO status:failure
    - title: Changes requested
      filters: is:open author:@me org:InSpace-GEO review:changes_requested
    - title: Ready to merge
      filters: is:open author:@me org:InSpace-GEO review:approved status:success
    - title: Needs My Review
      filters: is:open review-requested:@me org:InSpace-GEO
    - title: Involved
      filters: is:open involves:@me -author:@me org:InSpace-GEO
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: R
          name: Rebase PR
          background: true
          command: gh pr update-branch {{.PrNumber}} --repo {{.RepoName}} --rebase
        - key: i
          name: review in lazygit
          command: pr-review {{.RepoPath}} {{.PrNumber}}{{with index . "BaseRefName"}} {{.}} {{$.RepoName}}{{end}}
        - key: f
          name: submit review (approve / request changes / comment)
          command: PR_REVIEW_REPO={{.RepoName}} PR_REVIEW_PR={{.PrNumber}} pr-review submit
        - key: I
          name: Claude reviews first (findings go to your pending review)
          background: true
          command: pr-review ai {{.RepoPath}} {{.PrNumber}}{{with index . "BaseRefName"}} {{.}} {{$.RepoName}}{{end}}
        - key: T
          name: jump to the task session behind this PR
          background: true
          command: ~/Projects/.orchestrator/bin/pr-task.sh {{.RepoName}} {{.PrNumber}}
repoPaths:
    InSpace-GEO/*: ~/Projects/*
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
