git:
  # `|` cycles through these in the diff view.
  diffRenderers:
    - command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta
    - command: delta --paging=never --line-numbers --side-by-side
      name: delta side-by-side
    # Compares syntax trees rather than lines, so re-indented or reflowed code
    # shows only what actually changed.
    - type: extDiff
      command: difft --color=always --context={{diffContext}}
      name: difftastic
    - type: rawGit
      name: plain git
